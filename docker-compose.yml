version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cricket_db
    environment:
      POSTGRES_DB: cricket_academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "50000:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cricket_academy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: thamaraikannans/backend:v1
    container_name: cricket_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/cricket_academy
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: admin
      HIBERNATE_DDL_AUTO: update
      SHOW_SQL: "true"
    ports:
      - "8080:8080"

  frontend:
    image: thamaraikannans/front:v1
    container_name: cricket_frontend
    depends_on:
      - backend
    environment:
      BACKEND_BASE_URL: http://backend:8080/api
    ports:
      - "5000:5000"

volumes:
  db-data:
