{% extends "base.html" %}

{% block content %}
<h2>Coaches</h2>
<a href="{{ url_for('coaches_new') }}">Add Coach</a>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Specialty</th>
      <th>Experience (years)</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
  {% for c in coaches %}
    <tr>
      <td>{{ c.id }}</td>
      <td>{{ c.fullName }}</td>
      <td>{{ c.specialty }}</td>
      <td>{{ c.experienceYears }}</td>
      <td>
        <a href="{{ url_for('coaches_edit', coach_id=c.id) }}">Edit</a>
        <form action="{{ url_for('coaches_delete', coach_id=c.id) }}"
              method="post" style="display:inline">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
